# Render Configuration for Speedy Van
# Production-ready deployment configuration
# https://render.com/docs/blueprint-spec

services:
  # Main Web Application (Next.js)
  - type: web
    name: speedy-van-web
    runtime: node
    plan: standard # Recommended for production
    region: frankfurt # EU Central
    rootDir: apps/web
    buildCommand: |
      cd ..
      bash render-build.sh
    startCommand: cd apps/web && pnpm start
    # Health check endpoint - must respond within 5 seconds
    healthCheckPath: /api/health
    numInstances: 2 # High availability
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
    # Enable build cache for faster deployments
    autoDeploy: true
    envVars:
      # Node Environment
      - key: NODE_ENV
        value: production
      # Increase Node.js heap memory for build
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      
      # Database
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard
      
      # NextAuth
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://speedy-van-web.onrender.com # Update with your domain
      
      # Pusher (Real-time)
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        value: eu
      - key: NEXT_PUBLIC_PUSHER_KEY
        sync: false
      - key: NEXT_PUBLIC_PUSHER_CLUSTER
        value: eu
      
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      
      # Email
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: noreply@speedy-van.co.uk
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: noreply@speedy-van.co.uk
      
      # SMS
      - key: THESMSWORKS_KEY
        sync: false
      - key: THESMSWORKS_SECRET
        sync: false
      - key: THESMSWORKS_JWT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      
      # Other
      - key: JWT_SECRET
        generateValue: true
      - key: CUSTOM_KEY
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_TOKEN
        sync: false
      - key: NEXT_PUBLIC_WEATHER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      
      # Company Info
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: Speedy Van
      - key: NEXT_PUBLIC_COMPANY_PHONE
        value: "01202 129746"
      - key: NEXT_PUBLIC_COMPANY_EMAIL
        value: support@speedy-van.co.uk
      
      # Cron Security (not needed for node-cron, but keep for manual endpoint)
      - key: CRON_SECRET
        generateValue: true
      
      # Public URL
      - key: NEXT_PUBLIC_APP_URL
        value: https://speedy-van.co.uk

  # Cron Job 1: Send Review Requests (Every hour)
  - type: cron
    name: send-review-requests
    runtime: node
    schedule: "0 * * * *"
    buildCommand: echo "No build needed"
    startCommand: curl -X GET https://speedy-van.co.uk/api/cron/send-review-requests -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: speedy-van-web
          envVarKey: CRON_SECRET

  # Cron Job 2: Send Review Reminders (Every 6 hours)
  - type: cron
    name: send-review-reminders
    runtime: node
    schedule: "0 */6 * * *"
    buildCommand: echo "No build needed"
    startCommand: curl -X GET https://speedy-van.co.uk/api/cron/send-review-reminders -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: speedy-van-web
          envVarKey: CRON_SECRET

  # Optional: Background Worker (if you want separate process for cron)
  # - type: worker
  #   name: speedy-van-worker
  #   runtime: node
  #   buildCommand: pnpm install
  #   startCommand: node apps/web/src/lib/cron/worker.js
